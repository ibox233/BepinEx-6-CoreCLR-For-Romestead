name: Build and publish release

on:
  push:
    branches:
      - romestead-net8
    paths:
      - "BepInEx.sln"
      - "Directory.Build.props"
      - "nuget.config"
      - "BepInEx.Core/**"
      - "BepInEx.Preloader.Core/**"
      - "Native/**"
      - "Runtimes/NET/**"
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish Romestead BepInEx
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore
        shell: pwsh
        run: dotnet restore .\BepInEx.sln

      - name: Build
        shell: pwsh
        run: dotnet build .\BepInEx.sln -c Release --no-restore -p:GenerateDocumentationFile=true

      - name: Package
        id: package
        shell: pwsh
        run: |
          $win = .\packaging\package-release.ps1 -Configuration Release -Runtime win-x64
          $linux = .\packaging\package-release.ps1 -Configuration Release -Runtime linux-x64
          $serverWin = .\packaging\package-server-release.ps1 -Configuration Release -Runtime win-x64
          $serverLinux = .\packaging\package-server-release.ps1 -Configuration Release -Runtime linux-x64

          "win_asset_path=$($win.AssetPath)" >> $env:GITHUB_OUTPUT
          "win_asset_name=$($win.AssetName)" >> $env:GITHUB_OUTPUT
          "linux_asset_path=$($linux.AssetPath)" >> $env:GITHUB_OUTPUT
          "linux_asset_name=$($linux.AssetName)" >> $env:GITHUB_OUTPUT
          "server_win_asset_path=$($serverWin.AssetPath)" >> $env:GITHUB_OUTPUT
          "server_win_asset_name=$($serverWin.AssetName)" >> $env:GITHUB_OUTPUT
          "server_linux_asset_path=$($serverLinux.AssetPath)" >> $env:GITHUB_OUTPUT
          "server_linux_asset_name=$($serverLinux.AssetName)" >> $env:GITHUB_OUTPUT
          "release_tag=$($win.ReleaseTag)" >> $env:GITHUB_OUTPUT
          "release_name=$($win.ReleaseName)" >> $env:GITHUB_OUTPUT
          "loader_sha=$($win.LoaderSha)" >> $env:GITHUB_OUTPUT

      - name: Smoke test Windows package
        shell: pwsh
        run: .\packaging\smoke-test.ps1 -PackagePath "${{ steps.package.outputs.win_asset_path }}"

      - name: Smoke test Linux package
        shell: pwsh
        run: .\packaging\smoke-test.ps1 -PackagePath "${{ steps.package.outputs.linux_asset_path }}"

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/romestead-net8'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @(
            "Romestead BepInEx Mod Loader release."
            ""
            "Loader source commit: ``${{ steps.package.outputs.loader_sha }}``"
            ""
            "Windows install:"
            "Extract the win-x64 archive directly into the Romestead game folder. The Windows client uses the included ``d3d11.dll`` hook and does not need an install script."
            ""
            "Linux / Steam Proton package:"
            "Romestead does not currently have a native Linux client build. Extract the linux-x64 archive into the Proton game folder; it also uses the included ``d3d11.dll`` hook and does not need an install script."
            ""
            "Dedicated server packages:"
            "Use the matching Romestead-Server archive for Windows or Linux dedicated servers. Server packages do not use ``d3d11.dll``; they install a CoreCLR startup hook for ``Server.runtimeconfig.json``."
            ""
            "Launch Romestead through Steam. If the loader stops appearing after a game update, reinstall the matching package."
          ) -join "`n"

          gh release view "${{ steps.package.outputs.release_tag }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ steps.package.outputs.release_tag }}" `
              --target "${{ github.sha }}" `
              --title "${{ steps.package.outputs.release_name }}" `
              --notes $notes `
              --latest
          } else {
            gh release edit "${{ steps.package.outputs.release_tag }}" `
              --target "${{ github.sha }}" `
              --title "${{ steps.package.outputs.release_name }}" `
              --notes $notes `
              --latest
          }

          gh release upload "${{ steps.package.outputs.release_tag }}" `
            "${{ steps.package.outputs.win_asset_path }}" `
            "${{ steps.package.outputs.linux_asset_path }}" `
            "${{ steps.package.outputs.server_win_asset_path }}" `
            "${{ steps.package.outputs.server_linux_asset_path }}" `
            --clobber
