name: Linux smoke test

on:
  push:
    branches:
      - romestead-net8-linux
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build and package on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./BepInEx.sln

      - name: Build
        run: dotnet build ./BepInEx.sln -c Release --no-restore -p:GenerateDocumentationFile=true

      - name: Package linux asset
        id: package
        shell: pwsh
        run: |
          $result = ./packaging/package-release.ps1 -Configuration Release -Runtime linux-x64
          $result | Format-List
          if (-not (Test-Path -LiteralPath $result.AssetPath)) {
            throw "Package was not created: $($result.AssetPath)"
          }
          "asset_path=$($result.AssetPath)" >> $env:GITHUB_OUTPUT

      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$(find artifacts -maxdepth 1 -name 'Romestead-BepInEx-NET.CoreCLR-net8.0-linux-x64-*.zip' -print -quit)"
          test -n "$zip_path"
          unzip -l "$zip_path" | grep 'BepInEx/core/BepInEx.Core.dll'
          unzip -l "$zip_path" | grep 'install.sh'
          unzip -l "$zip_path" | grep 'uninstall.sh'

      - name: Smoke test package
        shell: pwsh
        run: ./packaging/smoke-test.ps1 -PackagePath "${{ steps.package.outputs.asset_path }}"
