name: Linux Proton package smoke test

on:
  push:
    branches:
      - romestead-net8-linux
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build and package Linux Proton asset
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore
        shell: pwsh
        run: dotnet restore .\BepInEx.sln

      - name: Build
        shell: pwsh
        run: dotnet build .\BepInEx.sln -c Release --no-restore -p:GenerateDocumentationFile=true

      - name: Package linux asset
        id: package
        shell: pwsh
        run: |
          $result = ./packaging/package-release.ps1 -Configuration Release -Runtime linux-x64
          $result | Format-List
          if (-not (Test-Path -LiteralPath $result.AssetPath)) {
            throw "Package was not created: $($result.AssetPath)"
          }
          "asset_path=$($result.AssetPath)" >> $env:GITHUB_OUTPUT

      - name: Inspect package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::OpenRead("${{ steps.package.outputs.asset_path }}")
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }

            foreach ($required in @(
              "d3d11.dll",
              "BepInEx.NET.CoreCLR.dll",
              "BepInEx.NET.CoreCLR.deps.json",
              "BepInEx/core/BepInEx.Core.dll"
            )) {
              if ($names -notcontains $required) {
                throw "Package is missing required file: $required"
              }
            }

            $scripts = $names | Where-Object { $_ -match '(^|/)(install|uninstall)\.(bat|ps1|sh)$' }
            if ($scripts) {
              throw "Client package contains obsolete install/uninstall scripts: $($scripts -join ', ')"
            }
          }
          finally {
            $zip.Dispose()
          }

      - name: Upload smoke test package
        uses: actions/upload-artifact@v4
        with:
          name: romestead-bepinex-linux-proton-smoke-package
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error

      - name: Smoke test package
        shell: pwsh
        run: ./packaging/smoke-test.ps1 -PackagePath "${{ steps.package.outputs.asset_path }}"
